[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veyronix"
version = "0.1.0"
description = "VEYRONIX — Predictive AI Incident & Root-Cause Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vedant Jaiswal" }]
keywords = ["aiops", "mlops", "anomaly-detection", "root-cause", "observability", "agents"]

# --- Core runtime (enough for simulator, data pipeline, ML, root-cause, API) ---
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1",
    "polars>=0.20",
    "duckdb>=0.10",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "networkx>=3.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "structlog>=24.1",
    "orjson>=3.9",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "joblib>=1.3",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.0",
    "mlflow>=2.11",
]
ai = [
    "mcp>=1.0",
    "anthropic>=0.25",
    "openai>=1.20",
]
db = [
    "psycopg[binary]>=3.1",
    "redis>=5.0",
]
otel = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24",
]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.9",
    "hypothesis>=6.100",
]

[project.scripts]
veyronix = "veyronix.cli:app"

[tool.setuptools.packages.find]
include = ["veyronix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast isolated tests",
    "integration: cross-component tests",
    "ml: model / metric tests",
    "agents: agent + tool tests",
    "security: safety / permission tests",
    "e2e: end-to-end pipeline tests",
    "slow: long-running tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", "web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["migrations", "web", "tests"]
